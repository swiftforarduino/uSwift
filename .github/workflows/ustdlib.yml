name: MicroSwiftStdlib

on:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: Build with debug symbols
        default: false
      updateBinaryRepo:
        type: boolean
        description: Update the binary repos uSwift-AVR and uSwift-ARM automatically.
        default: false
      clean:
        type: boolean
        description: Clean out workspace, tree and cached compilers before build.
        default: false

  push:
    branches:
    - main

  pull_request:
    branches:
    - main

# ARCH: 'AVR'
env:
  IN_CI: 'yes'

jobs:
  build-uswift:
    runs-on: [self-hosted, macOS]

    strategy:
      matrix:
        # arch: ['AVR']
        arch: ['AVR','ARM']

    env:
      S4A_WORKSPACE: ${{ github.workspace }}/workspace/${{ matrix.arch }}/S4A-install
      ARCH: ${{ matrix.arch }}
      SWIFT_COMPILER_DIR: ${{ github.workspace }}/../compilers/swift
      COMPILERS: https://swiftforarduino.com/compilers.php?compilers=1&email=compilers%40swiftforarduino.com&

    outputs:
      avr_sha: ${{ steps.update-binary-repo.outputs.avr_sha }}
      arm_sha: ${{ steps.update-binary-repo.outputs.arm_sha }}

    steps:

    - name: Set Environment Variables
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          if [ "${{ inputs.debug }}" = "true" ]; then
            echo "DEBUG=yes" >> $GITHUB_ENV
          else
            echo "DEBUG=no" >> $GITHUB_ENV
          fi
        else
          # Defaults for push/pull_request
          echo "DEBUG=no" >> $GITHUB_ENV
        fi

    - name: Clean
      if: inputs.clean
      run: rm -rf workspace bin deploy ../compilers

    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Git Submodule Update
      run: |
        git submodule init
        git submodule update --remote --recursive

    # It's slow and inefficient downloading the compiler every time.
    # We can upgrade it to some system that detects if it needs to update or not (rsync?)
    - name: Download Swift Compiler
      run: |
        ./get-compilers.sh ${SWIFT_COMPILER_DIR}
        ${SWIFT_COMPILER_DIR}/swift -version

    - name: Make install directory
      run: mkdir -p $S4A_WORKSPACE

    - name: Build uSwift
      run: /usr/bin/make

    - name: Archive Built Products
      uses: actions/upload-artifact@v4
      with:
        name: uSwift (AVR)
        path: ${{ env.S4A_WORKSPACE }}/**

    - name: Update Binary Repo
      if: inputs.updateBinaryRepo
      run: |
        output=$(/usr/bin/make update-github-binaries)
        echo "$output"
        line=$(echo "$output" | grep 'USWIFT_BINARY_SHA=')
        sha=${line#*USWIFT_BINARY_SHA=}
        if [ "${{ matrix.arch }}" = "AVR" ]; then
          echo "avr_sha=$sha" >> "$GITHUB_OUTPUT"
        else
          echo "arm_sha=$sha" >> "$GITHUB_OUTPUT"
        fi

  s4a-deploy:
    name: Update S4A repository
    needs: build-uswift
    if: inputs.updateBinaryRepo
    runs-on: [self-hosted, macOS]

    env:
      AVR_SHA: ${{ needs.build-uswift.outputs.avr_sha }}
      ARM_SHA: ${{ needs.build-uswift.outputs.arm_sha }}

    steps:
      - name: Checkout S4A
        uses: actions/checkout@v4
        with:
          repository: swiftforarduino/S4A
          fetch-depth: 0
          submodules: false

      - name: Create update branch
        run: |
          branch="update-uswift-$(date +%s)"
          git switch -c "$branch"
          echo "branch=$branch" >> "$GITHUB_ENV"

      - name: Update submodule pointers
        run: |
          echo "AVR binary commit sha id: $AVR_SHA"
          echo "ARM binary commit sha id: $ARM_SHA"

          git update-index --cacheinfo 160000,$AVR_SHA,BuildEngine/uSwift-AVR
          git update-index --cacheinfo 160000,$ARM_SHA,BuildEngine/uSwift-ARM

          echo
          echo "Changes:"
          git diff --cached --submodule=short

      - name: Commit changes
        run: |
          git add BuildEngine/uSwift-AVR BuildEngine/uSwift-ARM

          if git diff --cached --quiet; then
            echo "No submodule changes."
            exit 0
          fi

          git commit \
            -m "Update uSwift binary repositories" \
            -m "uSwift-AVR: $AVR_SHA" \
            -m "uSwift-ARM: $ARM_SHA"

      - name: Push update branch
        run: |
          git push --set-upstream origin "$branch"
