name: MicroSwiftStdlib

on:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: Build with debug symbols
        default: false
      updateBinaryRepo:
        type: boolean
        description: Update the binary repos uSwift-AVR and uSwift-ARM automatically.
        default: false
      clean:
        type: boolean
        description: Clean out workspace, tree and cached compilers before build.
        default: false

  push:
    branches:
    - main

  pull_request:
    branches:
    - main

# ARCH: 'AVR'
env:
  IN_CI: 'yes'

jobs:
  build-uswift:
    runs-on: [self-hosted, macOS, avrgcc]

    strategy:
      matrix:
        # arch: ['AVR']
        arch: ['AVR','ARM']

    env:
      S4A_WORKSPACE: ${{ github.workspace }}/workspace/${{ matrix.arch }}/S4A-install
      ARCH: ${{ matrix.arch }}
      SWIFT_COMPILER_DIR: ${{ github.workspace }}/../compilers/swift
      COMPILERS: https://swiftforarduino.com/compilers.php?compilers=1&email=compilers%40swiftforarduino.com&

    steps:

    - name: Set Environment Variables
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          if [ "${{ inputs.debug }}" = "true" ]; then
            echo "DEBUG=yes" >> $GITHUB_ENV
          else
            echo "DEBUG=no" >> $GITHUB_ENV
          fi
        else
          # Defaults for push/pull_request
          echo "DEBUG=no" >> $GITHUB_ENV
        fi

    - name: Clean
      if: inputs.clean
      run: rm -rf workspace bin deploy ../compilers

    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Git Submodule Update
      run: |
        git submodule init
        git submodule update --remote --recursive

    - name: Download Swift Compiler
      run: |
        ./get-compilers.sh ${SWIFT_COMPILER_DIR}
        ${SWIFT_COMPILER_DIR}/swift -version

    - name: Make install directory
      run: mkdir -p $S4A_WORKSPACE

    - name: Build uSwift
      run: /usr/bin/make

    - name: Archive Built Products
      uses: actions/upload-artifact@v4
      with:
        name: uSwift (AVR)
        path: ${{ env.S4A_WORKSPACE }}/**

    - name: Update Binary Repo
      if: inputs.updateBinaryRepo
      run: |
        output=$(/usr/bin/make update-github-binaries)
        echo "$output"
        line=$(echo "$output" | grep 'USWIFT_BINARY_SHA=')
        sha=${line#*USWIFT_BINARY_SHA=}
        echo "$sha" > "uswift-${{ matrix.arch }}.sha"
        echo "USWIFT_BINARY_SHA=$sha"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - name: Upload binary repo SHA
      if: inputs.updateBinaryRepo
      uses: actions/upload-artifact@v4
      with:
        name: uswift-${{ matrix.arch }}-sha
        path: uswift-${{ matrix.arch }}.sha

  s4a-deploy:
    name: Update S4A repository
    needs: build-uswift
    if: inputs.updateBinaryRepo
    runs-on: [self-hosted, macOS, avrgcc]

    env:
      S4A_DIR: ${{ github.workspace }}/workspace/s4a-deploy

    steps:
      - name: Download binary repo SHAs
        uses: actions/download-artifact@v4
        with:
          pattern: uswift-*-sha
          path: ${{ github.workspace }}/workspace/shas
          merge-multiple: true

      - name: Read binary repo SHAs
        run: |
          echo "AVR_SHA=$(cat "${{ github.workspace }}/workspace/shas/uswift-AVR.sha")" >> "$GITHUB_ENV"
          echo "ARM_SHA=$(cat "${{ github.workspace }}/workspace/shas/uswift-ARM.sha")" >> "$GITHUB_ENV"

      - name: Clone S4A
        run: |
          rm -rf "$S4A_DIR"

          git clone \
            --filter=blob:none \
            --depth=1 \
            --no-checkout \
            git@github.com:swiftforarduino/S4A.git \
            "$S4A_DIR"

      - name: Create update branch
        working-directory: ${{ env.S4A_DIR }}
        run: |
          cd "$S4A_DIR"

          branch="update-uswift-$(date +%s)"
          git switch -c "$branch"

          echo "branch=$branch" >> "$GITHUB_ENV"

      - name: Update submodule pointers
        working-directory: ${{ env.S4A_DIR }}
        run: |
          # Populate the index from HEAD without checking out the files.
          git read-tree HEAD

          echo "AVR binary commit sha id: $AVR_SHA"
          echo "ARM binary commit sha id: $ARM_SHA"

          git update-index \
            --cacheinfo 160000,$AVR_SHA,BuildEngine/uSwift-AVR

          git update-index \
            --cacheinfo 160000,$ARM_SHA,BuildEngine/uSwift-ARM

          echo
          echo "Changes:"
          git diff --cached --submodule=short

      - name: Commit changes
        working-directory: ${{ env.S4A_DIR }}
        run: |
          if git diff --cached --quiet; then
            echo "No submodule changes."
            exit 0
          fi

          git commit \
            -m "Update uSwift binary repositories" \
            -m "uSwift-AVR: $AVR_SHA" \
            -m "uSwift-ARM: $ARM_SHA"

      - name: Push update branch
        working-directory: ${{ env.S4A_DIR }}
        run: |
          git push --set-upstream origin "$branch"

      - name: Remove S4A clone
        if: always()
        run: |
          rm -rf "$S4A_DIR"
